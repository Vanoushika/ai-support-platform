name: ai-support-containers

x-app: &app
  image: ai-support-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &app-environment
    DATABASE_PATH: /data/tickets.db
    OLLAMA_BASE_URL: http://host.lima.internal:11434
    TEMPORAL_ADDRESS: temporal:7233
    VECTOR_BACKEND: pgvector
    VECTOR_HOST: vector-db
    VECTOR_DATABASE: support_knowledge
    VECTOR_USER: support
    VECTOR_SECRET_PROVIDER: openbao
    OPENBAO_ADDR: http://openbao:8200
    OPENBAO_CREDENTIALS_FILE: /run/secrets/bao_app_credentials
  extra_hosts:
    - "host.lima.internal:192.168.5.2"
  volumes:
    - tickets-data:/data
  secrets:
    - bao_app_credentials
  init: true

services:
  openbao:
    image: openbao/openbao:2.5.5
    # Root writes this local demo's named volume; mlock is disabled in config.
    user: "0:0"
    entrypoint: ["bao"]
    command: ["server", "-config=/bao/config/server.hcl"]
    ports:
      - "127.0.0.1:8201:8200"
    volumes:
      - ./openbao/config.hcl:/bao/config/server.hcl:ro
      - openbao-data:/bao/data
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vector-db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: support_knowledge
      POSTGRES_USER: support
      POSTGRES_PASSWORD_FILE: /run/secrets/vector_password
    secrets:
      - vector_password
    volumes:
      - vector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:1.9.1
    # Local development server only; not a production Temporal deployment.
    user: "0:0"
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "127.0.0.1:7234:7233"
      - "127.0.0.1:8234:8233"
    volumes:
      - temporal-data:/data
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  indexer:
    <<: *app
    depends_on:
      openbao:
        condition: service_healthy
      vector-db:
        condition: service_healthy
    command: ["python", "retrieval.py", "--index"]
    restart: "no"

  api:
    <<: *app
    environment:
      <<: *app-environment
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: support-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      temporal:
        condition: service_healthy
      indexer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *app
    environment:
      <<: *app-environment
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: support-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    command: ["python", "temporal_worker.py"]
    depends_on:
      temporal:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    # Root is used only for writing this isolated local-demo volume.
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=2d
      - --storage.tsdb.retention.size=512MB
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  tickets-data:
  temporal-data:
  tempo-data:
  prometheus-data:
  grafana-data:
  vector-data:
  openbao-data:

secrets:
  vector_password:
    file: ./.local-secrets/vector_password
  bao_app_credentials:
    file: ./.local-secrets/bao-app.json
